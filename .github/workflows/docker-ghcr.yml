name: Build and Push Docker image to GHCR and Deploy to Hetzner
on:
  push:
    branches: [ main ]  # or your default branch

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: 'true'
      
      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Run tests
        run: uv run pytest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.HETZNER_GHCR_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ghcr.io/miranas/air_pollution_app:latest
          cache-from: type=registry,ref=ghcr.io/miranas/air_pollution_app:buildcache
          cache-to: type=registry,ref=ghcr.io/miranas/air_pollution_app:buildcache,mode=max

      - name: Build Next.js frontend
        run: |
          cd frontend-next
          npm ci
          npm run build

      - name: Deploy frontend to Hetzner
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          source: "frontend-next/out/*"
          target: "/opt/air_pollution_app/frontend-next/out"
          strip_components: 0

  
  deploy_hetzner:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Copy config files to Hetzner
        uses: appleboy/scp-action@master
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          source: "docker/docker-compose.yml,docker/nginx.conf,prometheus.yml"
          target: "/opt/air_pollution_app"
          strip_components: 0
          rm: false


      - name: Deploy to Hetzner via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/air_pollution_app
            export APP_COMMIT_SHA=${{ github.sha }}

            echo ${{ secrets.HETZNER_GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Uporabi -f docker/docker-compose.yml povsod
            docker compose --env-file .env -f docker/docker-compose.yml pull backend
            docker compose --env-file .env -f docker/docker-compose.yml up -d --force-recreate --remove-orphans backend redis nginx
            # Monitoring services are recreated only when their own config changes.
            docker compose --env-file .env -f docker/docker-compose.yml up -d prometheus grafana portainer

            echo "--- compose ps ---"
            docker compose --env-file .env -f docker/docker-compose.yml ps
            echo "--- listening ports ---"
            ss -tulpen | grep -E ':80|:8000|:5000|:8501' || true

            # Fail the deploy if a monitoring service is exposed beyond localhost.
            if ss -tln | grep -E ':(3000|9090|9443)[[:space:]]' | grep -vq '127\.0\.0\.1'; then
              echo "ERROR: monitoring port exposed on a public interface"
              ss -tln | grep -E ':(3000|9090|9443)[[:space:]]' || true
              exit 1
            fi

            echo "--- local health checks (with retry) ---"
            status_ok=0
            for i in $(seq 1 15); do
              code=$(curl -sS -o /tmp/api_status.json -w "%{http_code}" --max-time 5 http://127.0.0.1/api/status || true)
              echo "attempt ${i}: /api/status HTTP ${code}"
              if [ "${code}" = "200" ]; then status_ok=1; break; fi
              sleep 3
            done
            [ "${status_ok}" = "1" ] || (echo "ERROR: /api/status did not become ready" && docker compose --env-file .env -f docker/docker-compose.yml logs --tail=120 nginx backend && exit 1)

            root_ok=0
            for i in $(seq 1 10); do
              code=$(curl -sS -o /tmp/root_page.html -w "%{http_code}" --max-time 5 http://127.0.0.1/ || true)
              echo "attempt ${i}: / HTTP ${code}"
              if [ "${code}" = "200" ]; then root_ok=1; break; fi
              sleep 2
            done
            [ "${root_ok}" = "1" ] || (echo "ERROR: frontend did not become ready" && docker compose --env-file .env -f docker/docker-compose.yml logs --tail=120 nginx backend && exit 1)

            echo "API status sample:"
            head -n 5 /tmp/api_status.json || true
            echo "Root page sample:"
            head -n 5 /tmp/root_page.html || true

            echo "--- api/latest check (with retry) ---"
            latest_ok=0
            for i in 1 2 3 4 5; do
              code=$(curl -sS -o /tmp/api_latest.json -w "%{http_code}" http://127.0.0.1/api/latest || true)
              echo "attempt ${i}: /api/latest HTTP ${code}"
              if [ "${code}" = "200" ]; then
                latest_ok=1
                break
              fi
              sleep 5
            done
            echo "api/latest sample:"
            head -n 5 /tmp/api_latest.json || true

            grep -qi "project" /tmp/api_status.json || (echo "ERROR: /api/status did not return backend JSON" && docker compose --env-file .env -f docker/docker-compose.yml logs --tail=120 nginx backend && exit 1)
            [ "${latest_ok}" = "1" ] || (echo "ERROR: /api/latest did not become ready (HTTP 200)" && docker compose --env-file .env -f docker/docker-compose.yml logs --tail=180 backend && exit 1)

            docker image prune -f
      
      

